name: directory-service

services:
  postgres:
    container_name: postgres-ds
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_DB: directory_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      PGDATA: /var/lib/postgresql/pgdata
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  seq:
    container_name: seq-ds
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "8081:80"
    restart: always

  redis:
    container_name: redis-ds
    image: redis:alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: always

  directory-service:
    build:
      context: .
      dockerfile: src/DirectoryService.Presentation/Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    container_name: directory-service
    restart: always
    ports:
      - "8002:8002"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DirectoryServiceDb: "Host=postgres;Port=5432;Database=directory_service_db;Username=postgres;Password=1234"
      ConnectionStrings__Redis: "redis:6379"
      Serilog__WriteTo__1__Args__serverUrl: "http://seq:80"
      FileServiceOptions__Url: "http://file-service:8003"
    depends_on:
      postgres:
        condition: service_started
      seq:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - default
      - shared-network

volumes:
  postgres-data:
    name: directoryservice-postgres-data
  redis-data:
    name: directoryservice-redis-data

networks:
  shared-network:
    external: true